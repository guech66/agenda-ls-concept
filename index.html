<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — LS Concept</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b3a50;
    --navy-light: #244860;
    --navy-dark: #122736;
    --gold: #b59853;
    --gold-light: #d4b97a;
    --gold-pale: rgba(181,152,83,0.12);
    --gold-border: rgba(181,152,83,0.3);
    --white: #f5f0e8;
    --text: #e8dfc8;
    --text-dim: rgba(232,223,200,0.5);
    --hour-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--navy-dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header {
    background: var(--navy);
    border-bottom: 1px solid var(--gold-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .logo img { height: 44px; border-radius: 4px; }
  .header-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .week-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--gold-light);
    letter-spacing: 2px;
  }
  .week-number {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .nav-btns { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    background: var(--gold-pale);
    border: 1px solid var(--gold-border);
    color: var(--gold);
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--gold); color: var(--navy-dark); }
  .today-btn { background: var(--gold); color: var(--navy-dark); font-weight: 600; }
  .today-btn:hover { background: var(--gold-light); }
  .agenda-wrap { padding: 0 16px 80px; overflow-x: auto; }
  .agenda-grid {
    display: grid;
    grid-template-columns: 56px repeat(7, 1fr);
    min-width: 700px;
    position: relative;
  }
  .day-headers {
    display: grid;
    grid-template-columns: 56px repeat(7, 1fr);
    min-width: 700px;
    position: sticky;
    top: 69px;
    z-index: 50;
    background: var(--navy-dark);
    border-bottom: 1px solid var(--gold-border);
    padding: 12px 0 8px;
    margin: 0 16px;
  }
  .day-header { text-align: center; padding: 4px 2px; cursor: pointer; }
  .day-name {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .day-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--text);
    line-height: 1.1;
    margin-top: 2px;
  }
  .day-header.today .day-num {
    background: var(--gold);
    color: var(--navy-dark);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2px auto 0;
    font-size: 18px;
    font-weight: 600;
  }
  .day-header.today .day-name { color: var(--gold); }
  .time-col { display: flex; flex-direction: column; }
  .time-slot {
    height: var(--hour-h);
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding-right: 10px;
    padding-top: 2px;
  }
  .time-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; white-space: nowrap; }
  .day-col {
    border-left: 1px solid rgba(181,152,83,0.1);
    position: relative;
    cursor: pointer;
  }
  .day-col:hover { background: rgba(181,152,83,0.03); }
  .hour-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px solid rgba(181,152,83,0.08);
    pointer-events: none;
  }
  .half-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px dashed rgba(181,152,83,0.04);
    pointer-events: none;
  }
  .event {
    position: absolute;
    left: 3px; right: 3px;
    border-radius: 4px;
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    overflow: hidden;
    border-left: 3px solid;
    transition: all 0.2s;
    z-index: 10;
  }
  .event:hover { transform: translateX(2px); box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 20; }
  .event-title { font-weight: 600; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-time { font-size: 10px; opacity: 0.8; margin-top: 1px; }
  .color-gold   { background: rgba(181,152,83,0.25); border-color: #b59853; color: #d4b97a; }
  .color-blue   { background: rgba(64,150,200,0.2);  border-color: #4096c8; color: #7dc4ec; }
  .color-green  { background: rgba(80,180,120,0.2);  border-color: #50b478; color: #7ddba8; }
  .color-red    { background: rgba(220,80,80,0.2);   border-color: #dc5050; color: #f08080; }
  .color-purple { background: rgba(150,80,200,0.2);  border-color: #9650c8; color: #c080f0; }
  .color-orange { background: rgba(220,140,50,0.2);  border-color: #dc8c32; color: #f0b464; }
  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--gold);
    z-index: 30;
    pointer-events: none;
  }
  .now-dot {
    position: absolute;
    left: -4px; top: -4px;
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,20,30,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--navy);
    border: 1px solid var(--gold-border);
    border-radius: 8px;
    padding: 28px;
    width: 92%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-16px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--gold-light);
    margin-bottom: 20px;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--gold-border);
    padding-bottom: 12px;
  }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--gold-border);
    border-radius: 4px;
    color: var(--text);
    padding: 9px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
  .form-select option { background: var(--navy-dark); }
  .form-textarea { resize: vertical; min-height: 70px; }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .color-dot.selected { border-color: white; transform: scale(1.2); }
  .color-dot[data-color="gold"]   { background: #b59853; }
  .color-dot[data-color="blue"]   { background: #4096c8; }
  .color-dot[data-color="green"]  { background: #50b478; }
  .color-dot[data-color="red"]    { background: #dc5050; }
  .color-dot[data-color="purple"] { background: #9650c8; }
  .color-dot[data-color="orange"] { background: #dc8c32; }
  .time-row { display: flex; gap: 8px; }
  .time-row > div { flex: 1; }
  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
    align-items: center;
  }
  .btn {
    padding: 9px 20px;
    border-radius: 4px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-cancel { background: rgba(255,255,255,0.05); border: 1px solid var(--gold-border); color: var(--text-dim); }
  .btn-cancel:hover { background: rgba(255,255,255,0.1); }
  .btn-save { background: var(--gold); color: var(--navy-dark); }
  .btn-save:hover { background: var(--gold-light); }
  .btn-delete { background: rgba(220,80,80,0.15); border: 1px solid rgba(220,80,80,0.4); color: #f08080; margin-right: auto; }
  .btn-delete:hover { background: rgba(220,80,80,0.3); }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 24px;
    border-top: 1px solid var(--gold-border);
    background: var(--navy);
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 80;
    align-items: center;
  }
  .legend-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-right: 4px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .reminder-badge { font-size: 9px; margin-top: 2px; opacity: 0.7; }
  .comment-badge { font-size: 9px; margin-top: 1px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>

  <div class="modal">
    <div class="modal-title" id="modalTitle">Nouvel événement</div>
    <div class="form-group">
      <label class="form-label">Titre</label>
      <input class="form-input" id="evTitle" placeholder="Intitulé du rendez-vous">
    </div>
    <div class="form-group">
      <div class="time-row">
        <div>
          <label class="form-label">Début</label>
          <input class="form-input" id="evStart" type="time" value="09:00">
        </div>
        <div>
          <label class="form-label">Fin</label>
          <input class="form-input" id="evEnd" type="time" value="10:00">
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Catégorie / Couleur</label>
      <div class="color-picker" id="colorPicker">
        <div class="color-dot selected" data-color="gold" title="Réunion"></div>
        <div class="color-dot" data-color="blue" title="Client"></div>
        <div class="color-dot" data-color="green" title="Chantier"></div>
        <div class="color-dot" data-color="red" title="Urgent"></div>
        <div class="color-dot" data-color="purple" title="Personnel"></div>
        <div class="color-dot" data-color="orange" title="Déplacement"></div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Rappel</label>
      <select class="form-select" id="evReminder">
        <option value="">Aucun rappel</option>
        <option value="5">5 minutes avant</option>
        <option value="15">15 minutes avant</option>
        <option value="30">30 minutes avant</option>
        <option value="60">1 heure avant</option>
        <option value="1440">1 jour avant</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Commentaire</label>
      <textarea class="form-textarea" id="evComment" placeholder="Notes, adresse, informations complémentaires..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-delete" id="btnDelete" style="display:none" onclick="deleteEvent()">Supprimer</button>
      <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn btn-save" onclick="saveEvent()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──
let events = JSON.parse(localStorage.getItem('ls_agenda_v2') || '[]');
let currentMonday = getMonday(new Date());
let editingId = null;
let clickedDay = null;
let selectedColor = 'gold';

const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const START_HOUR = 7;
const END_HOUR = 20;
const HOURS = Array.from({length: END_HOUR - START_HOUR}, (_, i) => START_HOUR + i);

function getMonday(d) {
  var dt = new Date(d);
  var day = dt.getDay();
  var diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  dt.setHours(0,0,0,0);
  return dt;
}

function getWeekNumber(d) {
  var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function addDays(d, n) {
  var dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function timeToMinutes(t) {
  var parts = t.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function minutesToTime(m) {
  var h = Math.floor(m / 60).toString().padStart(2, '0');
  var min = (m % 60).toString().padStart(2, '0');
  return h + ':' + min;
}

function renderHeader() {
  var sunday = addDays(currentMonday, 6);
  var wn = getWeekNumber(currentMonday);
  var mStart = MONTHS[currentMonday.getMonth()];
  var mEnd = MONTHS[sunday.getMonth()];
  var yStart = currentMonday.getFullYear();
  var yEnd = sunday.getFullYear();
  var label = mStart === mEnd ? mStart + ' ' + yStart :
              yStart === yEnd ? mStart + ' — ' + mEnd + ' ' + yStart :
              mStart + ' ' + yStart + ' — ' + mEnd + ' ' + yEnd;
  document.getElementById('weekLabel').textContent = label;
  document.getElementById('weekNum').textContent = 'Semaine ' + wn;

  var container = document.getElementById('dayHeaders');
  container.innerHTML = '<div></div>';
  var today = new Date();
  for (var i = 0; i < 7; i++) {
    var day = addDays(currentMonday, i);
    var isToday = isSameDay(day, today);
    var div = document.createElement('div');
    div.className = 'day-header' + (isToday ? ' today' : '');
    div.innerHTML = '<div class="day-name">' + DAYS[i] + '</div><div class="day-num">' + day.getDate() + '</div>';
    container.appendChild(div);
  }
}

function renderGrid() {
  var grid = document.getElementById('agendaGrid');
  grid.innerHTML = '';
  var today = new Date();
  var totalHeight = HOURS.length * 56;

  var timeCol = document.createElement('div');
  timeCol.className = 'time-col';
  HOURS.forEach(function(h) {
    var slot = document.createElement('div');
    slot.className = 'time-slot';
    slot.innerHTML = '<span class="time-label">' + h + ':00</span>';
    timeCol.appendChild(slot);
  });
  grid.appendChild(timeCol);

  for (var i = 0; i < 7; i++) {
    (function(dayIndex) {
      var day = addDays(currentMonday, dayIndex);
      var col = document.createElement('div');
      col.className = 'day-col';
      col.style.height = totalHeight + 'px';
      col.style.position = 'relative';

      HOURS.forEach(function(h, idx) {
        var line = document.createElement('div');
        line.className = 'hour-line';
        line.style.top = (idx * 56) + 'px';
        col.appendChild(line);
        var half = document.createElement('div');
        half.className = 'half-line';
        half.style.top = (idx * 56 + 28) + 'px';
        col.appendChild(half);
      });

      if (isSameDay(day, today)) {
        var now = new Date();
        var mins = (now.getHours() - START_HOUR) * 60 + now.getMinutes();
        if (mins >= 0 && mins <= (END_HOUR - START_HOUR) * 60) {
          var top = (mins / 60) * 56;
          var nowLine = document.createElement('div');
          nowLine.className = 'now-line';
          nowLine.style.top = top + 'px';
          nowLine.innerHTML = '<div class="now-dot"></div>';
          col.appendChild(nowLine);
        }
      }

      col.addEventListener('click', function(e) {
        if (e.target.closest('.event')) return;
        var rect = col.getBoundingClientRect();
        var relY = e.clientY - rect.top;
        var mins = Math.round((relY / 56) * 60 / 15) * 15;
        var startMins = (START_HOUR * 60) + mins;
        var startTime = minutesToTime(Math.min(startMins, (END_HOUR - 1) * 60));
        var endTime = minutesToTime(Math.min(startMins + 60, END_HOUR * 60));
        openModal(null, day, startTime, endTime);
      });

      var dayStr = day.toISOString().slice(0, 10);
      var dayEvents = events.filter(function(ev) { return ev.date === dayStr; });

      dayEvents.forEach(function(ev) {
        var startMins = timeToMinutes(ev.start) - START_HOUR * 60;
        var endMins = timeToMinutes(ev.end) - START_HOUR * 60;
        var top = (startMins / 60) * 56;
        var height = Math.max(((endMins - startMins) / 60) * 56, 24);

        var evEl = document.createElement('div');
        evEl.className = 'event color-' + (ev.color || 'gold');
        evEl.style.top = top + 'px';
        evEl.style.height = height + 'px';
        evEl.innerHTML =
          '<div class="event-title">' + ev.title + '</div>' +
          '<div class="event-time">' + ev.start + ' – ' + ev.end + '</div>' +
          (ev.reminder ? '<div class="reminder-badge">🔔 Rappel</div>' : '') +
          (ev.comment ? '<div class="comment-badge">💬 ' + ev.comment.substring(0, 30) + '</div>' : '');

        evEl.addEventListener('click', function(e) {
          e.stopPropagation();
          openModal(ev, day);
        });
        col.appendChild(evEl);
      });

      grid.appendChild(col);
    })(i);
  }
}

function render() {
  renderHeader();
  renderGrid();
}

function changeWeek(dir) {
  currentMonday = addDays(currentMonday, dir * 7);
  render();
}

function goToday() {
  currentMonday = getMonday(new Date());
  render();
}

function openModal(ev, day, startTime, endTime) {
  editingId = ev ? ev.id : null;
  clickedDay = day;
  document.getElementById('modalTitle').textContent = ev ? 'Modifier l\'événement' : 'Nouvel événement';
  document.getElementById('evTitle').value = ev ? ev.title : '';
  document.getElementById('evStart').value = ev ? ev.start : (startTime || '09:00');
  document.getElementById('evEnd').value = ev ? ev.end : (endTime || '10:00');
  document.getElementById('evReminder').value = ev ? (ev.reminder || '') : '';
  document.getElementById('evComment').value = ev ? (ev.comment || '') : '';
  document.getElementById('btnDelete').style.display = ev ? 'block' : 'none';
  selectedColor = ev ? (ev.color || 'gold') : 'gold';
  document.querySelectorAll('.color-dot').forEach(function(d) {
    d.classList.toggle('selected', d.dataset.color === selectedColor);
  });
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(function() { document.getElementById('evTitle').focus(); }, 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  editingId = null;
}

function saveEvent() {
  var title = document.getElementById('evTitle').value.trim();
  if (!title) { document.getElementById('evTitle').focus(); return; }
  var ev = {
    id: editingId || Date.now().toString(),
    date: clickedDay.toISOString().slice(0, 10),
    title: title,
    start: document.getElementById('evStart').value,
    end: document.getElementById('evEnd').value,
    color: selectedColor,
    reminder: document.getElementById('evReminder').value,
    comment: document.getElementById('evComment').value.trim()
  };
  if (editingId) {
    events = events.map(function(e) { return e.id === editingId ? ev : e; });
  } else {
    events.push(ev);
  }
  localStorage.setItem('ls_agenda_v2', JSON.stringify(events));
  closeModal();
  render();
  if (ev.reminder) scheduleReminder(ev);
}

function deleteEvent() {
  if (!confirm('Supprimer cet événement ?')) return;
  events = events.filter(function(e) { return e.id !== editingId; });
  localStorage.setItem('ls_agenda_v2', JSON.stringify(events));
  closeModal();
  render();
}

function scheduleReminder(ev) {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(function(perm) {
    if (perm !== 'granted') return;
    var parts = ev.start.split(':');
    var evTime = new Date(ev.date);
    evTime.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
    var reminderTime = new Date(evTime.getTime() - ev.reminder * 60000);
    var delay = reminderTime.getTime() - Date.now();
    if (delay > 0) {
      setTimeout(function() {
        new Notification('LS Concept — Rappel', { body: ev.title + ' dans ' + ev.reminder + ' min' });
      }, delay);
    }
  });
}

// Color picker
document.querySelectorAll('.color-dot').forEach(function(dot) {
  dot.addEventListener('click', function() {
    document.querySelectorAll('.color-dot').forEach(function(d) { d.classList.remove('selected'); });
    dot.classList.add('selected');
    selectedColor = dot.dataset.color;
  });
});

// Nav buttons
document.getElementById('btnPrev').onclick = function() { changeWeek(-1); };
document.getElementById('btnNext').onclick = function() { changeWeek(1); };
document.getElementById('btnToday').onclick = goToday;

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Update now line every minute
setInterval(function() { renderGrid(); }, 60000);

// Init
render();
</script>
</body>
</html>
